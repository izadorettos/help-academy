<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Redefinição de senha — Help Academy</title>
    <style>
      body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
      .container { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 8px; padding: 40px; }
      h1 { font-size: 22px; color: #111; }
      p { color: #444; line-height: 1.6; }
      .btn { display: inline-block; margin-top: 24px; padding: 12px 24px; background: #e4002b; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; }
      .footer { margin-top: 32px; font-size: 12px; color: #888; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Redefinição de senha</h1>
      <p>Recebemos uma solicitação para redefinir a senha da sua conta na <strong>Help Academy</strong>.</p>
      <p>Clique no botão abaixo para criar uma nova senha:</p>
      <a href="{{ .ConfirmationURL }}" class="btn">Redefinir minha senha</a>
      <p class="footer">
        Se você não solicitou a redefinição de senha, ignore este e-mail — sua senha permanece a mesma.<br />
        Link válido por 1 hora.
      </p>
    </div>
  </body>
</html>
